services:
  tracker:
    build: .
    container_name: tracker
    restart: unless-stopped
    environment:
      PLACES: ${PLACES:-}
      WEBHOOK: ${WEBHOOK:-}
      ROLE: ${ROLE:-}
      POLL_INTERVAL: ${POLL_INTERVAL:-20}
      USERS: ${USERS:-}
      PLAYER_WEBHOOK: ${PLAYER_WEBHOOK:-}
      PLAYER_ROLE: ${PLAYER_ROLE:-}
      PLAYER_POLL_INTERVAL: ${PLAYER_POLL_INTERVAL:-30}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-15}
      STATE_FILE: /data/state.json
    volumes:
      - tracker-data:/data

volumes:
  tracker-data:
